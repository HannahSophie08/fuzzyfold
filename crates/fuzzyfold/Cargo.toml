[package]
name = "fuzzyfold"
version = "0.6.0"
description = "Nucleic acid secondary structure kinetics."
documentation = "https://docs.rs/fuzzyfold"
keywords = ["dna", "rna", "secondary-structure", "kinetics", "nearest-neighbor"]
readme = "../../README.md"

edition.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true

autobins = false

[[bin]]
name = "ff-randseq"
path = "src/bin/ff-randseq.rs"

[[bin]]
name = "ff-eval"
path = "src/bin/ff-eval.rs"

[[bin]]
name = "ff-explore"
path = "src/bin/ff-explore.rs"

[[bin]]
name = "ff-trajectory"
path = "src/bin/ff-trajectory.rs"

[[bin]]
name = "ff-ensemble"
path = "src/bin/ff-ensemble.rs"

[[bin]]
name = "ff-timecourse"
path = "src/bin/ff-timecourse.rs"

[[bin]]
name = "ff-competition"
path = "src/bin/ff-competition.rs"

[[bin]]
name = "ff-edit-rate"
path = "src/bin/ff-edit-rate.rs"

[[bin]]
name = "ff-edit"
path = "src/bin/ff-edit.rs"

[[bin]]
name = "ff-editing-frequency"
path = "src/bin/ff-editing-frequency.rs"

[[bin]]
name = "ff-interactions"
path = "src/bin/ff-interactions.rs"

[[bin]]
name = "ff-ratio"
path = "src/bin/ff-ratio.rs"

[[bin]]
name = "ff-subopt"
path = "src/bin/ff-subopt.rs"

[[bin]]
name = "ff-subopt-competition"
path = "src/bin/ff-subopt-competition.rs"

[[bin]]
name = "ff-subopt-edit_rate"
