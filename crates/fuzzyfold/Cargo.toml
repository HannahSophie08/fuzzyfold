[[bin]]
name = "ff-accessibility"
path = "src/bin/ff-accessibility.rs"

[[bin]]
name = "ff-run-accessibility"
path = "src/bin/ff-run-accessibility.rs"

[dependencies]
ff_structure.workspace = true
